name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Capture configured state
        run: scripts/capture-state.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: warm
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gitlab-ce-warm:test

      - name: Smoke test
        run: scripts/smoke-test.sh gitlab-ce-warm:test

      - name: Capture Release Drafter seed
        run: scripts/capture-seed.sh release-drafter gitlab-ce-warm:test

      - name: Build preseeded test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release-drafter
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: gitlab-ce-warm:release-drafter-test

      - name: Smoke test preseeded image without Sidekiq
        env:
          GITLAB_DISABLED_SERVICES: sidekiq
        run: scripts/smoke-test.sh gitlab-ce-warm:release-drafter-test

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # zstd layers decompress several times faster than gzip during pulls.
      - name: Push image by digest
        if: github.event_name != 'pull_request'
        id: push-warm
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: warm
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true

      - name: Push preseeded image by digest
        if: github.event_name != 'pull_request'
        id: push-release-drafter
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release-drafter
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true

      - name: Export digests
        if: github.event_name != 'pull_request'
        env:
          WARM_DIGEST: ${{ steps.push-warm.outputs.digest }}
          RELEASE_DRAFTER_DIGEST: ${{ steps.push-release-drafter.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests/warm" "$RUNNER_TEMP/digests/release-drafter"
          touch "$RUNNER_TEMP/digests/warm/${WARM_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/release-drafter/${RELEASE_DRAFTER_DIGEST#sha256:}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          version=$(sed -n 's/^FROM gitlab\/gitlab-ce:\([^@]*\)@.* AS base$/\1/p' "$GITHUB_WORKSPACE/Dockerfile")
          test -n "$version"
          create() {
            local variant=$1 digest sources=()
            shift
            for digest in "$variant"/*; do
              sources+=("$IMAGE@sha256:${digest##*/}")
            done
            docker buildx imagetools create "$@" "${sources[@]}"
          }
          create warm --tag "$IMAGE:$version" --tag "$IMAGE:latest"
          create release-drafter --tag "$IMAGE:$version-release-drafter" --tag "$IMAGE:release-drafter"
          docker buildx imagetools inspect "$IMAGE:$version"
          docker buildx imagetools inspect "$IMAGE:$version-release-drafter"
